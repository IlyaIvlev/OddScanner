name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Поднимаем PostgreSQL для тестов, так как у вас в application.yml указан порт 5433
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: oddscanner
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Если у вас есть тесты, которые используют Playwright, раскомментируйте следующие 3 строки:
      # - name: Install Playwright Browsers
      #   run: ./mvnw exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/oddscanner
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: password

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: oddscanner-jar
          path: target/*.jar